# Release pipeline: on a vX.Y.Z tag, build and push a multi-arch (amd64 + arm64) static sealantd
# image to GHCR. The workspace image consumes it via `COPY --from` (see docs/runtime/integration.md).
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # A prerelease tag (vX.Y.Z-anything) would publish to npm `latest` and tag the image `latest`.
  # Prereleases publish from main in next.yml (ADR 0015 in sealant-sh/mend), never from a tag.
  # And no next build of X.Y.Z may come from a commit this tag leaves out: it would sort below X.Y.Z
  # but hold more. Main is frozen from the Version Packages merge to this tag (sealant-sh/mend
  # docs/operations/next-channel.md); a merge during the freeze is what produces one.
  stable-tag:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Refuse a prerelease tag
        run: |
          [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::$GITHUB_REF_NAME is not a stable vX.Y.Z tag. Prereleases publish from main."
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      # The published manifests depend on no alias: an `npm:` dependency belongs only to the -next
      # packages, which next.yml writes on the runner, never in the repository.
      - name: Refuse an npm alias in the published packages
        run: |
          # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
          node -e '
            const fs = require("node:fs");
            const problems = [];
            for (const name of ["runtime-protocol", "runtime-client"]) {
              const manifest = JSON.parse(fs.readFileSync(`packages/${name}/package.json`, "utf8"));
              for (const field of ["dependencies", "peerDependencies", "optionalDependencies"]) {
                for (const [dependency, spec] of Object.entries(manifest[field] ?? {})) {
                  if (String(spec).startsWith("npm:")) problems.push(`${name}: ${dependency}@${spec}`);
                }
              }
            }
            if (problems.length > 0) {
              console.error(`::error::A release cannot depend on an alias: ${problems.join(", ")}`);
              process.exit(1);
            }
          '
      - name: Refuse a release that leaves out one of its next builds
        run: >-
          node scripts/next-version.mjs --stray "$GITHUB_REF_NAME" --npm
          @sealant/runtime-client-next HEAD

  image:
    needs: stable-tag
    # Blacksmith runner, but no Blacksmith layer cache: other jobs write it, and this job pushes.
    # (The npm job stays on ubuntu-latest — github-hosted — to keep OIDC trusted publishing safe.)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU emulates arm64 on this amd64 runner; useblacksmith/setup-docker-builder adds sticky-disk
      # layer caching. Real arm64 speedup later = native arm64 Blacksmith runners + a per-arch matrix
      # (drops QEMU).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  npm:
    needs: stable-tag
    # npm trusted publishing (OIDC) needs a GitHub-hosted runner: this job stays off Blacksmith.
    runs-on: ubuntu-latest
    # Gate every publish behind a protected environment: add required reviewers + restrict deployment
    # to protected tags in repo Settings -> Environments -> release. This means a compromised PR,
    # dependency, or fork cannot trigger a publish without human approval.
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC: lets npm Trusted Publishing authenticate with no stored token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Enable Corepack BEFORE setup-node: setup-node@v5 reads package.json#packageManager
      # (pnpm@11.1.0) and needs pnpm on PATH. Corepack ships with Node, so nothing runs on the
      # deprecated Node 20 action runtime.
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      # --ignore-scripts: never run dependency lifecycle scripts in the publish job. The build below
      # needs none (codegen is committed; build is just tsc).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Sync the SDK package versions to the git tag (tag is the single source of truth).
      - run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pnpm --filter "@sealant/runtime-protocol" --filter "@sealant/runtime-client" \
            exec npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: pnpm -r build
      # Tokenless publish via npm Trusted Publishing: the OIDC id-token (permissions above)
      # authenticates the publish — no stored credential. --provenance attaches a public build
      # attestation (the source repo is public). Configure the matching trusted publisher on
      # npmjs.com for BOTH packages: repo sealant-sh/sealantd, workflow release.yml, env release.
      - run: pnpm -r publish --access public --no-git-checks --provenance
