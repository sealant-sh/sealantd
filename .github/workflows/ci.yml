# Tests on every PR and on pushes to main.
#
# SECURITY: this uses `pull_request` (NOT `pull_request_target`). That means PRs — including from
# forks — run in the PR's own context with a read-only GITHUB_TOKEN and NO access to repo secrets.
# A malicious PR can run code in the ephemeral runner but cannot read secrets, push, or publish.
# Nothing here references a secret, by design.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A runner-size measurement. Every push and pull request run stays on the box.
  workflow_dispatch:
    inputs:
      runner:
        description: Runner for the box's x86 jobs (a measurement; pushes and pull requests use the box)
        type: choice
        default: box
        options:
          - box
          - blacksmith-2vcpu-ubuntu-2404
          - blacksmith-4vcpu-ubuntu-2404
          - ubuntu-latest

# Least privilege: read-only, no write, no id-token.
permissions:
  contents: read

# A pull request's new push cancels its previous run. A push to main is never cancelled: each main
# commit gets its own group, so every one finishes, and `next` (which runs on a passed `ci` of a
# main push) sees every main commit, not only the last of a quick series. A dispatch is its own
# group: sharing its commit's would let it cancel that commit's push run, and Next with it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || (github.event_name == 'pull_request' && github.ref || github.sha) }}
  cancel-in-progress: true

jobs:
  # A pull request that changes documentation only runs nothing below (scripts/ci-docs-only.sh).
  # A job its `if` skips reports success, so the required rust and node checks still pass. Only a
  # `changes` job that succeeded can skip them: GitHub keeps a job's outputs when a later step
  # fails, so a failed one runs everything whatever `code` says (scripts/ci-docs-only.test.mjs).
  changes:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the diff against the pull request's base
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci-docs-only.sh >>"$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ${{ inputs.runner && inputs.runner != 'box' && inputs.runner || fromJSON('["self-hosted","box","linux","x64"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the git token in .git for later steps
      - uses: dtolnay/rust-toolchain@stable # the same stable toolchain on every runner
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2 # cache ~/.cargo + target so deps aren't recompiled each run
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The dotfiles tests apply real trees with stow and chezmoi; with the tools required they
      # fail instead of skipping when either is missing.
      - run: scripts/ci-install-dotfiles-tools.sh
      # nextest runs the test binaries side by side, each test in its own process: cargo test ran
      # the 100 binaries one after another (~120 s of tests that take ~20 s side by side).
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.146
      # ubuntu-latest is Linux, so this also runs the Linux-only tests (inotify, peer-cred, reaper).
      - run: cargo nextest run --workspace --no-fail-fast
        env:
          SEALANTD_REQUIRE_DOTFILES_TOOLS: "1"
          # Hosted runners impose no no-new-privileges: the per-person runtime test must prove
          # the daemon leaves it unset, not pass with nothing to show.
          SEALANTD_REQUIRE_NNP_FREE: "1"
      # nextest does not run doctests (there are none today); this keeps a future one from skipping.
      - run: cargo test --workspace --doc
      # Ownership on restore needs root (chown, a process as another uid): the test binaries
      # built above run again under sudo, where they fail instead of skipping.
      - run: scripts/ci-root-tests.sh

  # The released daemon runs on arm64 too (Graviton MicroVMs), so the same tests run natively
  # there. fmt is architecture-independent and stays on the job above.
  rust-arm64:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: scripts/ci-install-dotfiles-tools.sh
      # nextest runs the test binaries side by side, each test in its own process: cargo test ran
      # the 100 binaries one after another (~120 s of tests that take ~20 s side by side).
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.146
      - run: cargo nextest run --workspace --no-fail-fast
        env:
          SEALANTD_REQUIRE_DOTFILES_TOOLS: "1"
          # Hosted runners impose no no-new-privileges: the per-person runtime test must prove
          # the daemon leaves it unset, not pass with nothing to show.
          SEALANTD_REQUIRE_NNP_FREE: "1"
      - run: cargo test --workspace --doc

  node:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ${{ inputs.runner && inputs.runner != 'box' && inputs.runner || fromJSON('["self-hosted","box","linux","x64"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # setup-node v6 restores a package-manager cache by itself when packageManager names npm.
          package-manager-cache: false
          node-version: 24
          # The box links installs from its persistent pnpm store; other runners start empty.
          cache: ${{ inputs.runner && inputs.runner != 'box' && 'pnpm' || '' }}
      # --ignore-scripts: never run dependency lifecycle scripts (untrusted on fork PRs).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The prerelease version next.yml publishes (the same script lives in Core and Mend), and the
      # steps release.yml and next.yml publish with, run against stand-ins.
      - run: >-
          node --test scripts/next-version.test.mjs scripts/check-tarball.test.mjs
          scripts/republish.test.mjs scripts/next-tag.test.mjs scripts/ci-docs-only.test.mjs
          scripts/workflow-runners.test.mjs scripts/release-manifest.test.mjs
          scripts/release-publication.test.mjs scripts/release-overrides.test.mjs
          scripts/release-npm.test.mjs scripts/ci-concurrency.test.mjs
      - run: pnpm -r build
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked -p sealantd # the TypeScript e2e spawns the daemon binary
      - run: pnpm -r test
