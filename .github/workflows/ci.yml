# Tests on every PR and on pushes to main.
#
# SECURITY: this uses `pull_request` (NOT `pull_request_target`). That means PRs — including from
# forks — run in the PR's own context with a read-only GITHUB_TOKEN and NO access to repo secrets.
# A malicious PR can run code in the ephemeral runner but cannot read secrets, push, or publish.
# Nothing here references a secret, by design.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: read-only, no write, no id-token.
permissions:
  contents: read

# A pull request's new push cancels its previous run. A push to main is never cancelled: each main
# commit gets its own group, so every one finishes, and `next` (which runs on a passed `ci` of a
# main push) sees every main commit, not only the last of a quick series.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the git token in .git for later steps
      - uses: dtolnay/rust-toolchain@stable # Blacksmith runners don't preinstall Rust like github-hosted
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2 # cache ~/.cargo + target so deps aren't recompiled each run
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The dotfiles tests apply real trees with stow and chezmoi; with the tools required they
      # fail instead of skipping when either is missing.
      - run: scripts/ci-install-dotfiles-tools.sh
      # ubuntu-latest is Linux, so this also runs the Linux-only tests (inotify, peer-cred, reaper).
      - run: cargo test --workspace
        env:
          SEALANTD_REQUIRE_DOTFILES_TOOLS: "1"

  # The released daemon runs on arm64 too (Graviton MicroVMs), so the same tests run natively
  # there. fmt is architecture-independent and stays on the job above.
  rust-arm64:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: scripts/ci-install-dotfiles-tools.sh
      - run: cargo test --workspace
        env:
          SEALANTD_REQUIRE_DOTFILES_TOOLS: "1"

  node:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # setup-node v6 restores a package-manager cache by itself when packageManager names npm.
          package-manager-cache: false
          node-version: 24
      # --ignore-scripts: never run dependency lifecycle scripts (untrusted on fork PRs).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The prerelease version next.yml publishes; the same script lives in Core and Mend.
      - run: node --test scripts/next-version.test.mjs scripts/check-tarball.test.mjs scripts/republish.test.mjs
      - run: pnpm -r build
      - uses: dtolnay/rust-toolchain@stable # Blacksmith runners don't preinstall Rust
      - run: cargo build --locked -p sealantd # the TypeScript e2e spawns the daemon binary
      - run: pnpm -r test
