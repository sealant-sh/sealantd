# Changesets versioning. On push to main, open/update a "Version Packages" PR that bumps the two
# SDK packages (fixed together) and writes CHANGELOGs.
#
# SECURITY: this ONLY opens a PR — it has no `publish` step and no npm credentials. It runs only on
# direct pushes to this repo's main (forks/PRs do not trigger `push`); the repository guard is extra
# belt. Publishing stays exclusively in release.yml (tag-triggered, environment-gated, OIDC).
name: version

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'sealant-sh/sealantd'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write # commit the version bump to the changeset-release branch
      pull-requests: write # open/update the Version Packages PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # setup-node v6 restores a package-manager cache by itself when packageManager names npm.
          package-manager-cache: false
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm changeset version
          # No `publish:` — this workflow never publishes. Merge the Version PR, then tag to release.
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
