# Prereleases from main (ADR 0015 in sealant-sh/mend, docs/adr/0015-next-channel.md). Every main
# commit whose `ci` run passed publishes, under one version B-next.N (scripts/next-version.mjs: N is
# the commit's whole history, B never below a base already published since the last stable tag):
#
# - ghcr.io/sealant-sh/sealantd-next:<version>, amd64 and arm64, each built natively;
# - @sealant/runtime-protocol-next and @sealant/runtime-client-next <version> on npm's `next`
#   dist-tag, after the image exists, so every SDK prerelease has its daemon.
#
# Prereleases live under separate names, package and image alike. The `next` trusted publisher is
# registered only on the two -next packages, so even a fully compromised run cannot publish
# @sealant/runtime-* or move their `latest`. Images have no such boundary: the token the image jobs
# hold (`packages: write`) can push ghcr.io/sealant-sh/sealantd too, GHCR cannot scope it per image,
# and any writer can run a branch workflow that requests it, code-owner review or not. Every action
# and BuildKit image in those jobs is pinned and no cache other jobs write is restored; Core pins
# sealantd as `tag@sha256:…`, which keeps out a tag moved after the pin (ADR 0015, Known gaps).
#
# SECURITY: `workflow_run` runs this file as it is on main, never a pull request's copy, and the
# guard below accepts only a push to this repository's main, not a fork's branch that happens to be
# called main. The npm credential (OIDC, `id-token: write`) is held only by `publish`, which checks
# out nothing, installs nothing and runs no repository code. It refuses an artifact holding anything
# but the expected tarballs, runs npm from an empty directory, and never publishes the tarballs
# `pack` made: it extracts each with npm's own pacote, rewrites package.json from an allowlist,
# checks the -next name, version and commit on that, repacks it, and publishes that under `next`.
# Register the publisher on the two -next packages only (never on @sealant/runtime-*): repository
# sealant-sh/sealantd, workflow next.yml, environment next.
name: next

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: next
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.repository == 'sealant-sh/sealantd' && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      # Full history and tags: N counts the commit's whole history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # setup-node v6 restores a package-manager cache by itself when packageManager names npm.
          package-manager-cache: false
          node-version: 24
      - name: Resolve the version
        id: plan
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version=$(node scripts/next-version.mjs --package packages/runtime-client --npm @sealant/runtime-client-next HEAD)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+-next\.[0-9]+$ ]] || {
            echo "::error::\"$version\" is not a next version."
            exit 1
          }
          # A version already on npm was published completely (npm is the last step): a re-run of
          # this commit publishes nothing again. The same version from another commit is refused.
          # Every lookup fails the run on a registry error; nothing reads as "not published".
          publish=true
          from=$(node scripts/next-version.mjs --published @sealant/runtime-client-next "$version")
          if [[ -n $from ]]; then
            if [[ $from != "$SHA" ]]; then
              echo "::error::@sealant/runtime-client-next@$version was published from $from, not $SHA."
              exit 1
            fi
            publish=false
            echo "sealantd $version is already published from this commit; nothing to do."
          fi
          # `next` only moves forward. Every newer commit computes a higher version, so this fails
          # only for an older commit re-run after a newer one published: loudly, before any build.
          # `publish` checks again right before publishing.
          if [[ $publish == true ]]; then
            current=$(node scripts/next-version.mjs --dist-tag @sealant/runtime-client-next next)
            if [[ -n $current ]] && ! node scripts/next-version.mjs --newer "$version" "$current"; then
              echo "::error::npm's next is already $current; $version from this commit is not newer. A newer commit published first."
              exit 1
            fi
          fi
          {
            echo "version=$version"
            echo "sha=$SHA"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  image:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    strategy:
      matrix:
        platform:
          - { arch: amd64, runner: blacksmith-4vcpu-ubuntu-2404 }
          - { arch: arm64, runner: blacksmith-4vcpu-ubuntu-2404-arm }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      # BuildKit at a fixed digest: it runs privileged and performs the push.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          outputs:
            type=image,name=ghcr.io/${{ github.repository }}-next,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next-digests--${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-tag:
    needs: [plan, image]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.tag.outputs.digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: next-digests--*
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image
        id: tag
        working-directory: /tmp/digests
        env:
          REPOSITORY: ghcr.io/${{ github.repository }}-next
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # A version is tagged once. A re-run after a failed npm job keeps the image Core may
          # already have pulled.
          if ! docker buildx imagetools inspect "$REPOSITORY:$VERSION" >/dev/null 2>&1; then
            sources=()
            for digest in *; do sources+=("$REPOSITORY@sha256:$digest"); done
            docker buildx imagetools create --tag "$REPOSITORY:$VERSION" "${sources[@]}"
          fi
          docker buildx imagetools inspect "$REPOSITORY:$VERSION"
          digest=$(docker buildx imagetools inspect "$REPOSITORY:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # Builds and packs the two packages. No id-token here: nothing this job runs, the dependencies'
  # build tools included, can reach the npm credential.
  pack:
    needs: [plan, image-tag]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # setup-node v6 restores a package-manager cache by itself when packageManager names npm.
          package-manager-cache: false
          node-version: 24
      # --ignore-scripts: never run dependency lifecycle scripts.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The version and the commit go into each package.json: npm records `gitHead`, which the plan
      # job compares on a re-run and Core's and Mend's release guards read.
      - name: Set the prerelease version and commit
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          for package in packages/runtime-protocol packages/runtime-client; do
            (cd "$package" && npm version "$VERSION" --no-git-tag-version --allow-same-version \
              && npm pkg set "gitHead=$SHA")
          done
      - run: pnpm -r build
      # Prereleases publish under their own names: @sealant/runtime-protocol-next, and
      # @sealant/runtime-client-next depending on it exactly through an alias, so code still imports
      # @sealant/runtime-protocol.
      - name: Pack under the -next names and check the tarballs
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          (cd packages/runtime-protocol && npm pkg set name=@sealant/runtime-protocol-next)
          (cd packages/runtime-client && npm pkg set name=@sealant/runtime-client-next \
            "dependencies.@sealant/runtime-protocol=npm:@sealant/runtime-protocol-next@$VERSION")
          mkdir -p "$RUNNER_TEMP/tarballs"
          for package in packages/runtime-protocol packages/runtime-client; do
            (cd "$package" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done
          # Every file each manifest exports is in its tarball, and nothing sits outside package/.
          node scripts/check-tarball.mjs "$RUNNER_TEMP"/tarballs/*.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next-tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 1

  # Holds the npm credential and runs nothing from the repository: no checkout. It checks each
  # tarball is ours, this version and this commit, that `next` would move forward, and publishes.
  publish:
    needs: [plan, image-tag, pack]
    # npm trusted publishing (OIDC) needs a GitHub-hosted runner: this job stays off Blacksmith.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: next
    permissions:
      id-token: write
    steps:
      # Node 24: trusted publishing needs the bundled npm >= 11.5, whose pacote the block uses.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # setup-node v6 restores a package-manager cache by itself when packageManager names npm.
          package-manager-cache: false
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: next-tarballs
          path: tarballs
      - name: Rebuild and publish under next
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
          DIGEST: ${{ needs.image-tag.outputs.digest }}
        run: |
          set -euo pipefail
          # --- republish ---
          # republish.test.mjs runs this block as written, against a stub registry. The callers check the
          # downloaded artifact directory first (check_artifacts), then run every npm command from a fresh
          # empty directory, so no .npmrc in or near the artifact can configure npm. The tarball pack built is
          # never published as it is: npm's own copy of pacote (no install, nothing unpinned loads) extracts
          # it, package.json is rewritten from an allowlist (no `tag`, no scripts, no publishConfig but
          # `access`), a root binding.gyp is refused (npm would add an install script for it), the rewritten
          # manifest is checked, and `npm pack` builds the tarball that is published.
          # Failures inside $(...) stop the job too.
          shopt -s inherit_errexit
          KEEP_FIELDS='["name","version","description","license","repository","homepage","bugs","keywords","type","main","module","types","typings","exports","files","bin","man","directories","engines","dependencies","peerDependencies","peerDependenciesMeta","optionalDependencies","gitHead"]'

          # The artifact directory <dir> holds exactly the expected tarballs (regular files), nothing else.
          check_artifacts() {
            local dir=$1 extra expected
            shift
            extra=$(cd "$dir" && find . -mindepth 1 | sed 's|^\./||' | grep -vxF -f <(printf '%s\n' "$@") || true)
            if [[ -n $extra ]]; then
              echo "::error::The artifact holds more than the expected tarballs: $(tr '\n' ' ' <<<"$extra")"
              return 1
            fi
            for expected in "$@"; do
              if [[ ! -f $dir/$expected || -L $dir/$expected ]]; then
                echo "::error::$expected is missing from the artifact, or is not a regular file."
                return 1
              fi
            done
          }

          # GET <path> from the registry, retried; a failure or a 404 stops the job: never guessed.
          registry_get() {
            # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
            node -e '
              const [where, registry] = process.argv.slice(1);
              const url = new URL(where, registry.endsWith("/") ? registry : `${registry}/`);
              const run = async () => {
                for (let attempt = 1; attempt <= 4; attempt += 1) {
                  try {
                    const response = await fetch(url, { headers: { accept: "application/json" } });
                    if (response.ok) return process.stdout.write(JSON.stringify(await response.json()));
                    if (attempt === 4) throw new Error(`the registry answered ${response.status} for ${where}`);
                  } catch (error) {
                    if (attempt === 4) {
                      console.error(`::error::${error.message}`);
                      process.exit(1);
                    }
                  }
                  await new Promise((resolve) => setTimeout(resolve, attempt * 1500));
                }
              };
              run();
            ' -- "$1" "$(npm config get registry)"
          }

          # A dist-tag's version, or nothing, from the uncached dist-tags endpoint.
          dist_tag() {
            local tags
            tags=$(registry_get "-/package/${1/\//%2f}/dist-tags")
            node -e 'process.stdout.write(String(JSON.parse(process.argv[1])[process.argv[2]] ?? ""))' "$tags" "$2"
          }

          # The commit a published version came from ("unknown" without gitHead), or nothing if unpublished.
          published_from() {
            local record
            record=$(registry_get "${1/\//%2f}")
            node -e '
              const found = JSON.parse(process.argv[1]).versions?.[process.argv[2]];
              process.stdout.write(found === undefined ? "" : String(found.gitHead ?? "unknown"));
            ' "$record" "$2"
          }

          # Whether $1 is a newer next version than $2 (X.Y.Z-next.N; a stable X.Y.Z sorts after them).
          newer() {
            node -e '
              const order = (v) => {
                const [core, n] = v.split("-next.");
                return [...core.split(".").map(Number), n === undefined ? Infinity : Number(n)];
              };
              const [a, b] = [order(process.argv[1]), order(process.argv[2])];
              if ([...a, ...b].some(Number.isNaN)) process.exit(2);
              const i = a.findIndex((x, k) => x !== b[k]);
              process.exit(i >= 0 && a[i] > b[i] ? 0 : 1);
            ' "$1" "$2"
          }

          # Extracts <tarball> with pacote, rewrites and checks its manifest, repacks it; prints the new path.
          rebuild_tarball() {
            local tarball=$1 name=$2 version=$3 commit=$4 channel=$5 work packed pacote
            pacote=${REPUBLISH_TEST_PACOTE:-$(npm root -g)/npm/node_modules/pacote}
            work=$(mktemp -d)
            # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
            node -e '
              const fs = require("node:fs");
              const path = require("node:path");
              const [pacotePath, tarball, dir, name, version, commit, channel, keepText] = process.argv.slice(1);
              const pacote = require(pacotePath);
              const run = async () => {
                await pacote.extract(`file:${path.resolve(tarball)}`, dir);
                const read = JSON.parse(fs.readFileSync(path.join(dir, "package.json"), "utf8"));
                const manifest = {};
                for (const field of JSON.parse(keepText)) if (field in read) manifest[field] = read[field];
                if (read.publishConfig?.access !== undefined) manifest.publishConfig = { access: read.publishConfig.access };
                const shape = channel === "next" ? /^\d+\.\d+\.\d+-next\.\d+$/ : /^\d+\.\d+\.\d+$/;
                // A -next package depends on its siblings only as `npm:@sealant/<sibling>-next@<this version>`;
                // anything else (and any alias at all outside the -next packages) is refused.
                const isNextPackage = /^@sealant\/[a-z0-9-]+-next$/.test(String(manifest.name));
                const dependencyProblems = ["dependencies", "peerDependencies", "optionalDependencies"].flatMap(
                  (field) =>
                    Object.entries(manifest[field] ?? {}).flatMap(([dependency, spec]) => {
                      const alias = String(spec).startsWith("npm:");
                      if (!dependency.startsWith("@sealant/")) {
                        return alias ? [`${dependency} is an alias (${spec})`] : [];
                      }
                      const expected = `npm:${dependency}-next@${version}`;
                      if (isNextPackage) return spec === expected ? [] : [`${dependency}@${spec}, not ${expected}`];
                      return alias ? [`${dependency} is an alias (${spec})`] : [];
                    }),
                );
                const problems = [
                  channel === "next" && name !== "@sealant/mend" && !isNextPackage &&
                    `${manifest.name} is not a -next package`,
                  ...dependencyProblems,
                  manifest.name !== name && `name ${manifest.name}, not ${name}`,
                  manifest.version !== version && `version ${manifest.version}, not ${version}`,
                  !shape.test(String(manifest.version)) && `${manifest.version} is not a ${channel} version`,
                  manifest.gitHead !== commit && `gitHead ${manifest.gitHead}, not ${commit}`,
                  fs.existsSync(path.join(dir, "binding.gyp")) && "a binding.gyp, which npm turns into an install script",
                ].filter(Boolean);
                if (problems.length > 0) {
                  console.error(`::error::${name}: ${problems.join("; ")}`);
                  process.exit(1);
                }
                fs.writeFileSync(path.join(dir, "package.json"), `${JSON.stringify(manifest, null, 2)}\n`);
              };
              run().catch((error) => {
                console.error(`::error::${name}: ${error.message}`);
                process.exit(1);
              });
            ' "$pacote" "$tarball" "$work/package" "$name" "$version" "$commit" "$channel" "$KEEP_FIELDS" >&2
            # A packed .npmrc would configure the pack below; nothing else in the tree runs.
            find "$work/package" -name .npmrc -delete
            packed=$(cd "$work/package" && npm pack --ignore-scripts --json --pack-destination "$work")
            printf '%s/%s\n' "$work" "$(node -e 'process.stdout.write(JSON.parse(process.argv[1])[0].filename)' "$packed")"
          }

          # Publishes <tarball> as <name>@<version> from <commit> under <channel>; extra npm flags follow.
          # A version already published from this commit is done; from another commit, refused. Under next,
          # refused unless newer than the current next, read right before publishing, so a re-run of an old
          # job cannot move next back.
          publish_rebuilt() {
            local tarball=$1 name=$2 version=$3 commit=$4 channel=$5 from current rebuilt
            shift 5
            from=$(published_from "$name" "$version")
            if [[ -n $from ]]; then
              if [[ $from != "$commit" ]]; then
                echo "::error::$name@$version was published from $from, not $commit."
                return 1
              fi
              echo "$name@$version is already published from this commit."
              return 0
            fi
            if [[ $channel == next ]]; then
              current=$(dist_tag "$name" next)
              if [[ -n $current ]] && ! newer "$version" "$current"; then
                echo "::error::$name's next is already $current, not older than $version. Nothing was published."
                return 1
              fi
            fi
            rebuilt=$(rebuild_tarball "$tarball" "$name" "$version" "$commit" "$channel")
            npm publish "$rebuilt" --tag "$channel" --access public --ignore-scripts "$@"
          }
          # --- end republish ---

          artifacts="$GITHUB_WORKSPACE/tarballs"
          check_artifacts "$artifacts" "sealant-runtime-protocol-next-$VERSION.tgz" "sealant-runtime-client-next-$VERSION.tgz"
          # Every npm command runs from an empty directory: no project .npmrc can reach it.
          cd "$(mktemp -d)"
          # The protocol first: the client depends on its exact version.
          for name in runtime-protocol-next runtime-client-next; do
            publish_rebuilt "$artifacts/sealant-$name-$VERSION.tgz" "@sealant/$name" "$VERSION" "$SHA" next --provenance
          done
          {
            echo "## sealantd $VERSION"
            echo
            echo "From \`$SHA\`."
            echo
            echo "- \`ghcr.io/$GITHUB_REPOSITORY-next:$VERSION\` (\`$DIGEST\`)"
            echo "- \`@sealant/runtime-protocol-next@$VERSION\`, \`@sealant/runtime-client-next@$VERSION\` on npm \`next\`"
          } >> "$GITHUB_STEP_SUMMARY"
