# Prereleases from main (ADR 0015 in sealant-sh/mend, docs/adr/0015-next-channel.md). Every main
# commit whose `ci` run passed publishes, under one version B-next.N (scripts/next-version.mjs: N is
# the commit's whole history, B never below a base already published since the last stable tag):
#
# - ghcr.io/sealant-sh/sealantd:<version>, amd64 and arm64, each built natively;
# - @sealant/runtime-protocol and @sealant/runtime-client <version> on npm's `next` dist-tag, after
#   the image exists, so every SDK prerelease has its daemon.
#
# `latest` (npm and GHCR) moves only from a vX.Y.Z tag, in release.yml. No floating tags: Core pins
# the exact version.
#
# SECURITY: `workflow_run` runs this file as it is on main, never a pull request's copy, and the
# guard below accepts only a push to this repository's main, not a fork's branch that happens to be
# called main. The npm credential (OIDC, `id-token: write`) is held only by `publish`, which checks
# out nothing and runs no repository code: it downloads the tarballs `pack` built and checked,
# refuses one with an entry outside package/, reads each one's name and version the way npm will
# publish it, and runs `npm publish --tag next`. A build dependency never sees it.
# Someone who can merge an edit to this file still could; that needs code-owner review on main
# (CODEOWNERS covers .github/ and scripts/) and the `next` environment limited to main, both
# repository settings (ADR 0015, decision 3). Register the publisher on both packages as a second
# trusted publisher: repository sealant-sh/sealantd, workflow next.yml, environment next.
name: next

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: next
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.repository == 'sealant-sh/sealantd' && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      # Full history and tags: N counts the commits since the minor's first release.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Resolve the version
        id: plan
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version=$(node scripts/next-version.mjs --package packages/runtime-client --npm @sealant/runtime-client HEAD)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+-next\.[0-9]+$ ]] || {
            echo "::error::\"$version\" is not a next version."
            exit 1
          }
          # A version already on npm was published completely (npm is the last step): a re-run of
          # this commit publishes nothing again. The same version from another commit (an older
          # commit re-run after a stable tag moved the base) is refused.
          publish=true
          if [[ -n $(npm view "@sealant/runtime-client@$version" version 2>/dev/null) ]]; then
            published_from=$(npm view "@sealant/runtime-client@$version" gitHead 2>/dev/null || true)
            if [[ $published_from != "$SHA" ]]; then
              echo "::error::@sealant/runtime-client@$version was published from ${published_from:-an unknown commit}, not $SHA."
              exit 1
            fi
            publish=false
            echo "sealantd $version is already published from this commit; nothing to do."
          fi
          # `next` only moves forward. Every newer commit computes a higher version, so this fails
          # only for an older commit re-run after a newer one published: loudly, before any build.
          current=$(npm view @sealant/runtime-client dist-tags.next 2>/dev/null || true)
          if [[ $publish == true && -n $current ]] &&
            ! node scripts/next-version.mjs --newer "$version" "$current"; then
            echo "::error::npm's next is already $current; $version from this commit is not newer. A newer commit published first."
            exit 1
          fi
          {
            echo "version=$version"
            echo "sha=$SHA"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  image:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    strategy:
      matrix:
        platform:
          - { arch: amd64, runner: blacksmith-4vcpu-ubuntu-2404 }
          - { arch: arm64, runner: blacksmith-4vcpu-ubuntu-2404-arm }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: useblacksmith/setup-docker-builder@v1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          outputs:
            type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: next-digests--${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-tag:
    needs: [plan, image]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.tag.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: next-digests--*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image
        id: tag
        working-directory: /tmp/digests
        env:
          REPOSITORY: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # A version is tagged once. A re-run after a failed npm job keeps the image Core may
          # already have pulled.
          if ! docker buildx imagetools inspect "$REPOSITORY:$VERSION" >/dev/null 2>&1; then
            sources=()
            for digest in *; do sources+=("$REPOSITORY@sha256:$digest"); done
            docker buildx imagetools create --tag "$REPOSITORY:$VERSION" "${sources[@]}"
          fi
          docker buildx imagetools inspect "$REPOSITORY:$VERSION"
          digest=$(docker buildx imagetools inspect "$REPOSITORY:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # Builds and packs the two packages. No id-token here: nothing this job runs, the dependencies'
  # build tools included, can reach the npm credential.
  pack:
    needs: [plan, image-tag]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # --ignore-scripts: never run dependency lifecycle scripts.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The version and the commit go into each package.json: npm records `gitHead`, which the plan
      # job compares on a re-run and Core's and Mend's release guards read.
      - name: Set the prerelease version and commit
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          for package in packages/runtime-protocol packages/runtime-client; do
            (cd "$package" && npm version "$VERSION" --no-git-tag-version --allow-same-version \
              && npm pkg set "gitHead=$SHA")
          done
      - run: pnpm -r build
      - name: Pack and check the tarballs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tarballs"
          for package in packages/runtime-protocol packages/runtime-client; do
            (cd "$package" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done
          # Every file each manifest exports is in its tarball, and nothing sits outside package/.
          node scripts/check-tarball.mjs "$RUNNER_TEMP"/tarballs/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: next-tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 1

  # Holds the npm credential and runs nothing from the repository: no checkout. It checks each
  # tarball is ours, this version and this commit, that `next` would move forward, and publishes.
  publish:
    needs: [plan, image-tag, pack]
    # npm trusted publishing (OIDC) needs a GitHub-hosted runner: this job stays off Blacksmith.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: next
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          name: next-tarballs
          path: tarballs
      - name: Check and publish under next
        working-directory: tarballs
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
          DIGEST: ${{ needs.image-tag.outputs.digest }}
        run: |
          set -euo pipefail
          # --- tarball check ---
          # scripts/check-tarball.test.mjs runs this block as written. npm extracts a tarball with
          # strip: 1, so an entry outside package/ (or a second package/package.json) could carry the
          # manifest npm really publishes: refuse both, then take the name and version from npm's own
          # dry run, and require both readings to be this run's next version.
          check_tarball() {
            local tarball=$1 name=$2 version=$3 commit=$4 entries manifest dry
            [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+-next\.[0-9]+$ ]] || {
              echo "::error::$version is not a next version."
              return 1
            }
            entries=$(tar -tzf "$tarball")
            if grep -v '^package/' <<<"$entries" | grep -q .; then
              echo "::error::$tarball has entries outside package/."
              return 1
            fi
            if [[ $(grep -cx 'package/package.json' <<<"$entries" || true) != 1 ]]; then
              echo "::error::$tarball does not have exactly one package/package.json."
              return 1
            fi
            manifest=$(tar -xzOf "$tarball" package/package.json)
            dry=$(npm publish "./$tarball" --dry-run --json --tag next 2>/dev/null)
            # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
            node -e '
              const [name, version, commit, manifestText, dryText] = process.argv.slice(1);
              const manifest = JSON.parse(manifestText);
              const dry = JSON.parse(dryText);
              const problems = [
                manifest.name !== name && `name ${manifest.name}`,
                manifest.version !== version && `version ${manifest.version}`,
                manifest.gitHead !== commit && `gitHead ${manifest.gitHead}`,
                dry.name !== name && `npm would publish ${dry.name}`,
                dry.version !== version && `npm would publish version ${dry.version}`,
                !/-next\.\d+$/.test(String(dry.version)) && `${dry.version} is not a next version`,
              ].filter(Boolean);
              if (problems.length > 0) {
                console.error(`::error::${name}: ${problems.join(", ")}`);
                process.exit(1);
              }
            ' "$name" "$version" "$commit" "$manifest" "$dry"
          }
          # --- end tarball check ---
          # The protocol first: the client depends on its exact version. `plan` decided this commit
          # publishes; a package already there is a re-run resuming after a partial publish, and
          # must be from this commit.
          for name in runtime-protocol runtime-client; do
            tarball="sealant-$name-$VERSION.tgz"
            [[ -f $tarball ]] || { echo "::error::$tarball is missing."; exit 1; }
            if [[ -n $(npm view "@sealant/$name@$VERSION" version 2>/dev/null) ]]; then
              from=$(npm view "@sealant/$name@$VERSION" gitHead 2>/dev/null || true)
              [[ $from == "$SHA" ]] || {
                echo "::error::@sealant/$name@$VERSION was published from ${from:-an unknown commit}."
                exit 1
              }
              echo "@sealant/$name@$VERSION is already published from this commit."
              continue
            fi
            check_tarball "$tarball" "@sealant/$name" "$VERSION" "$SHA"
            npm publish "./$tarball" --tag next --access public --provenance --ignore-scripts
          done
          {
            echo "## sealantd $VERSION"
            echo
            echo "From \`$SHA\`."
            echo
            echo "- \`ghcr.io/$GITHUB_REPOSITORY:$VERSION\` (\`$DIGEST\`)"
            echo "- \`@sealant/runtime-protocol@$VERSION\`, \`@sealant/runtime-client@$VERSION\` on npm \`next\`"
          } >> "$GITHUB_STEP_SUMMARY"
