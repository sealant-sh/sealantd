# Prereleases from main (ADR 0015 in sealant-sh/mend, docs/adr/0015-next-channel.md). Every main
# commit whose `ci` run passed publishes, under one version B-next.N (scripts/next-version.mjs: N is
# the commit's whole history, B never below a base already published since the last stable tag):
#
# - ghcr.io/sealant-sh/sealantd:<version>, amd64 and arm64, each built natively;
# - @sealant/runtime-protocol and @sealant/runtime-client <version> on npm's `next` dist-tag, after
#   the image exists, so every SDK prerelease has its daemon.
#
# `latest` (npm and GHCR) moves only from a vX.Y.Z tag, in release.yml. No floating tags: Core pins
# the exact version.
#
# SECURITY: `workflow_run` runs this file as it is on main, never a pull request's copy, and the
# guard below accepts only a push to this repository's main, not a fork's branch that happens to be
# called main. The npm credential (OIDC, `id-token: write`) is held only by `publish`, which checks
# out nothing and runs no repository code. It never publishes the tarballs `pack` made: it extracts
# each with pacote (npm's own reader, pinned and installed in the job), rewrites package.json from an
# allowlist (no `tag`, no scripts, no publishConfig but `access`), checks the name, the -next
# version and the commit on that, repacks it, and publishes that under `next`. A build dependency never sees it.
# Someone who can merge an edit to this file still could; that needs code-owner review on main
# (CODEOWNERS covers .github/ and scripts/) and the `next` environment limited to main, both
# repository settings (ADR 0015, decision 3). Register the publisher on both packages as a second
# trusted publisher: repository sealant-sh/sealantd, workflow next.yml, environment next.
name: next

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: next
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.repository == 'sealant-sh/sealantd' && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      # Full history and tags: N counts the commit's whole history.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Resolve the version
        id: plan
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version=$(node scripts/next-version.mjs --package packages/runtime-client --npm @sealant/runtime-client HEAD)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+-next\.[0-9]+$ ]] || {
            echo "::error::\"$version\" is not a next version."
            exit 1
          }
          # A version already on npm was published completely (npm is the last step): a re-run of
          # this commit publishes nothing again. The same version from another commit is refused.
          # Every lookup fails the run on a registry error; nothing reads as "not published".
          publish=true
          from=$(node scripts/next-version.mjs --published @sealant/runtime-client "$version")
          if [[ -n $from ]]; then
            if [[ $from != "$SHA" ]]; then
              echo "::error::@sealant/runtime-client@$version was published from $from, not $SHA."
              exit 1
            fi
            publish=false
            echo "sealantd $version is already published from this commit; nothing to do."
          fi
          # `next` only moves forward. Every newer commit computes a higher version, so this fails
          # only for an older commit re-run after a newer one published: loudly, before any build.
          # `publish` checks again right before publishing.
          if [[ $publish == true ]]; then
            current=$(node scripts/next-version.mjs --dist-tag @sealant/runtime-client next)
            if [[ -n $current ]] && ! node scripts/next-version.mjs --newer "$version" "$current"; then
              echo "::error::npm's next is already $current; $version from this commit is not newer. A newer commit published first."
              exit 1
            fi
          fi
          {
            echo "version=$version"
            echo "sha=$SHA"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  image:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    strategy:
      matrix:
        platform:
          - { arch: amd64, runner: blacksmith-4vcpu-ubuntu-2404 }
          - { arch: arm64, runner: blacksmith-4vcpu-ubuntu-2404-arm }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: useblacksmith/setup-docker-builder@v1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          outputs:
            type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: next-digests--${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-tag:
    needs: [plan, image]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.tag.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: next-digests--*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image
        id: tag
        working-directory: /tmp/digests
        env:
          REPOSITORY: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # A version is tagged once. A re-run after a failed npm job keeps the image Core may
          # already have pulled.
          if ! docker buildx imagetools inspect "$REPOSITORY:$VERSION" >/dev/null 2>&1; then
            sources=()
            for digest in *; do sources+=("$REPOSITORY@sha256:$digest"); done
            docker buildx imagetools create --tag "$REPOSITORY:$VERSION" "${sources[@]}"
          fi
          docker buildx imagetools inspect "$REPOSITORY:$VERSION"
          digest=$(docker buildx imagetools inspect "$REPOSITORY:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # Builds and packs the two packages. No id-token here: nothing this job runs, the dependencies'
  # build tools included, can reach the npm credential.
  pack:
    needs: [plan, image-tag]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # --ignore-scripts: never run dependency lifecycle scripts.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The version and the commit go into each package.json: npm records `gitHead`, which the plan
      # job compares on a re-run and Core's and Mend's release guards read.
      - name: Set the prerelease version and commit
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          for package in packages/runtime-protocol packages/runtime-client; do
            (cd "$package" && npm version "$VERSION" --no-git-tag-version --allow-same-version \
              && npm pkg set "gitHead=$SHA")
          done
      - run: pnpm -r build
      - name: Pack and check the tarballs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tarballs"
          for package in packages/runtime-protocol packages/runtime-client; do
            (cd "$package" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done
          # Every file each manifest exports is in its tarball, and nothing sits outside package/.
          node scripts/check-tarball.mjs "$RUNNER_TEMP"/tarballs/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: next-tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 1

  # Holds the npm credential and runs nothing from the repository: no checkout. It checks each
  # tarball is ours, this version and this commit, that `next` would move forward, and publishes.
  publish:
    needs: [plan, image-tag, pack]
    # npm trusted publishing (OIDC) needs a GitHub-hosted runner: this job stays off Blacksmith.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: next
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      # npm's own tarball reader, at a fixed version, installed here and not from the repository.
      - name: Install pacote
        run:
          npm install --prefix "$RUNNER_TEMP/tools" --no-save --no-package-lock --ignore-scripts
          --no-audit --no-fund pacote@21.5.0
      - uses: actions/download-artifact@v4
        with:
          name: next-tarballs
          path: tarballs
      - name: Rebuild and publish under next
        working-directory: tarballs
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
          DIGEST: ${{ needs.image-tag.outputs.digest }}
        run: |
          set -euo pipefail
          # --- republish ---
          # republish.test.mjs runs this block as written, against a stub registry. The tarball pack built is
          # never published as it is: npm's own reader (pacote, pinned in this job) extracts it, package.json
          # is rewritten from an allowlist (no `tag`, no scripts, no publishConfig but `access`), the rewritten
          # manifest is checked, and `npm pack` builds the tarball that is published. What is checked is what
          # is published. Three earlier checks of the tarball as built each missed a way npm reads it
          # differently (a second manifest outside package/, a `tag` field, package/./package.json).
          # Failures inside $(...) stop the job too.
          shopt -s inherit_errexit
          KEEP_FIELDS='["name","version","description","license","repository","homepage","bugs","keywords","type","main","module","types","typings","exports","files","bin","man","directories","engines","dependencies","peerDependencies","peerDependenciesMeta","optionalDependencies","gitHead"]'

          # The registry's record of a package, retried; a failure or a 404 stops the job: never guessed.
          packument() {
            # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
            node -e '
              const [name, registry] = process.argv.slice(1);
              const url = new URL(name.replace("/", "%2f"), registry.endsWith("/") ? registry : `${registry}/`);
              const run = async () => {
                for (let attempt = 1; attempt <= 4; attempt += 1) {
                  try {
                    const response = await fetch(url, { headers: { accept: "application/json" } });
                    if (response.ok) return process.stdout.write(JSON.stringify(await response.json()));
                    if (attempt === 4) throw new Error(`the registry answered ${response.status} for ${name}`);
                  } catch (error) {
                    if (attempt === 4) {
                      console.error(`::error::${error.message}`);
                      process.exit(1);
                    }
                  }
                  await new Promise((resolve) => setTimeout(resolve, attempt * 1500));
                }
              };
              run();
            ' "$1" "$(npm config get registry)"
          }

          # A dist-tag's version, or nothing.
          dist_tag() {
            local record
            record=$(packument "$1")
            node -e 'process.stdout.write(String(JSON.parse(process.argv[1])["dist-tags"]?.[process.argv[2]] ?? ""))' "$record" "$2"
          }

          # The commit a published version came from ("unknown" without gitHead), or nothing if unpublished.
          published_from() {
            local record
            record=$(packument "$1")
            node -e '
              const found = JSON.parse(process.argv[1]).versions?.[process.argv[2]];
              process.stdout.write(found === undefined ? "" : String(found.gitHead ?? "unknown"));
            ' "$record" "$2"
          }

          # Whether $1 is a newer next version than $2 (X.Y.Z-next.N; a stable X.Y.Z sorts after them).
          newer() {
            node -e '
              const order = (v) => {
                const [core, n] = v.split("-next.");
                return [...core.split(".").map(Number), n === undefined ? Infinity : Number(n)];
              };
              const [a, b] = [order(process.argv[1]), order(process.argv[2])];
              if ([...a, ...b].some(Number.isNaN)) process.exit(2);
              const i = a.findIndex((x, k) => x !== b[k]);
              process.exit(i >= 0 && a[i] > b[i] ? 0 : 1);
            ' "$1" "$2"
          }

          # Extracts <tarball> with pacote, rewrites and checks its manifest, repacks it; prints the new path.
          rebuild_tarball() {
            local tarball=$1 name=$2 version=$3 commit=$4 channel=$5 work packed
            work=$(mktemp -d)
            # shellcheck disable=SC2016 # JavaScript template literals, not shell expansions
            node -e '
              const fs = require("node:fs");
              const path = require("node:path");
              const pacote = require(process.env.PACOTE);
              const [tarball, dir, name, version, commit, channel, keepText] = process.argv.slice(1);
              const run = async () => {
                await pacote.extract(`file:${path.resolve(tarball)}`, dir);
                const read = JSON.parse(fs.readFileSync(path.join(dir, "package.json"), "utf8"));
                const manifest = {};
                for (const field of JSON.parse(keepText)) if (field in read) manifest[field] = read[field];
                if (read.publishConfig?.access !== undefined) manifest.publishConfig = { access: read.publishConfig.access };
                const shape = channel === "next" ? /^\d+\.\d+\.\d+-next\.\d+$/ : /^\d+\.\d+\.\d+$/;
                const problems = [
                  manifest.name !== name && `name ${manifest.name}, not ${name}`,
                  manifest.version !== version && `version ${manifest.version}, not ${version}`,
                  !shape.test(String(manifest.version)) && `${manifest.version} is not a ${channel} version`,
                  manifest.gitHead !== commit && `gitHead ${manifest.gitHead}, not ${commit}`,
                ].filter(Boolean);
                if (problems.length > 0) {
                  console.error(`::error::${name}: ${problems.join("; ")}`);
                  process.exit(1);
                }
                fs.writeFileSync(path.join(dir, "package.json"), `${JSON.stringify(manifest, null, 2)}\n`);
              };
              run().catch((error) => {
                console.error(`::error::${name}: ${error.message}`);
                process.exit(1);
              });
            ' "$tarball" "$work/package" "$name" "$version" "$commit" "$channel" "$KEEP_FIELDS" >&2
            # A packed .npmrc would configure the pack below; nothing else in the tree runs.
            find "$work/package" -name .npmrc -delete
            packed=$(cd "$work/package" && npm pack --ignore-scripts --json --pack-destination "$work")
            printf '%s/%s\n' "$work" "$(node -e 'process.stdout.write(JSON.parse(process.argv[1])[0].filename)' "$packed")"
          }

          # Publishes <tarball> as <name>@<version> from <commit> under <channel>; extra npm flags follow.
          # A version already published from this commit is done; from another commit, refused. Under next:
          # refused unless newer than the current next, checked here, right before publishing, so a re-run of
          # an old job cannot move next back; and afterwards `latest` must not be this version.
          publish_rebuilt() {
            local tarball=$1 name=$2 version=$3 commit=$4 channel=$5 from current latest_before latest rebuilt
            shift 5
            from=$(published_from "$name" "$version")
            if [[ -n $from ]]; then
              if [[ $from != "$commit" ]]; then
                echo "::error::$name@$version was published from $from, not $commit."
                return 1
              fi
              echo "$name@$version is already published from this commit."
              return 0
            fi
            latest_before=$(dist_tag "$name" latest)
            if [[ $channel == next ]]; then
              current=$(dist_tag "$name" next)
              if [[ -n $current ]] && ! newer "$version" "$current"; then
                echo "::error::$name's next is already $current, not older than $version. Nothing was published."
                return 1
              fi
            fi
            rebuilt=$(rebuild_tarball "$tarball" "$name" "$version" "$commit" "$channel")
            npm publish "$rebuilt" --tag "$channel" --access public --ignore-scripts "$@"
            if [[ $channel == next ]]; then
              latest=$(dist_tag "$name" latest)
              if [[ $latest == "$version" ]]; then
                echo "::error::$name@$version became latest. Moving latest back to ${latest_before:-nothing}."
                if [[ -z $latest_before ]] || ! npm dist-tag add "$name@$latest_before" latest; then
                  echo "::error::Could not move latest back. Run: npm dist-tag add $name@$latest_before latest"
                fi
                return 1
              fi
            fi
          }
          # --- end republish ---

          export PACOTE="$RUNNER_TEMP/tools/node_modules/pacote"
          # The protocol first: the client depends on its exact version.
          for name in runtime-protocol runtime-client; do
            tarball="sealant-$name-$VERSION.tgz"
            [[ -f $tarball ]] || { echo "::error::$tarball is missing."; exit 1; }
            publish_rebuilt "$tarball" "@sealant/$name" "$VERSION" "$SHA" next --provenance
          done
          {
            echo "## sealantd $VERSION"
            echo
            echo "From \`$SHA\`."
            echo
            echo "- \`ghcr.io/$GITHUB_REPOSITORY:$VERSION\` (\`$DIGEST\`)"
            echo "- \`@sealant/runtime-protocol@$VERSION\`, \`@sealant/runtime-client@$VERSION\` on npm \`next\`"
          } >> "$GITHUB_STEP_SUMMARY"
