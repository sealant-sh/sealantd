[package]
name = "sealantd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The sealantd runtime daemon binary."

[lints]
workspace = true

[dependencies]
sealant-protocol = { workspace = true }
sealant-runtime-core = { workspace = true }
sealant-telemetry = { workspace = true }
sealant-eventlog = { workspace = true }
sealant-process = { workspace = true }
sealant-pty = { workspace = true }
sealant-fs = { workspace = true }
sealant-network = { workspace = true }
sealant-control = { workspace = true }
sealant-capture = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
walkdir = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["dir"] }

[features]
# The dotfiles copy's hold seam (`SEALANTD_DOTFILES_TEST_HOLD`): for the root tests only. Only
# this crate's own tests enable it (the dev-dependency below); no build of the daemon may
# (`scripts/ci-test-support-gate.sh`).
test-support = []

[dev-dependencies]
sealantd = { path = ".", features = ["test-support"] }
# The manual clock (`ManualClock`, `CaptureConfig::clock`) for the capture tests: test builds only
# (`scripts/ci-test-support-gate.sh`).
sealant-capture = { workspace = true, features = ["test-support"] }
sealant-protocol = { workspace = true }
sealant-control = { workspace = true }
sealant-runtime-core = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
futures = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-pki-types = { workspace = true }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }
