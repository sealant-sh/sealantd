// sealantd control protocol — the cross-language wire contract (ADR-0012).
//
// Field names are snake_case (codegen idiomatizes per language). The Rust daemon keeps rich domain
// types + serde for a debug-JSON view and converts to/from these messages at the wire boundary.
syntax = "proto3";

package sealant.v1;

// ===================== enums =====================

enum RuntimeState {
  RUNTIME_STATE_UNSPECIFIED = 0;
  RUNTIME_STATE_STARTING = 1;
  RUNTIME_STATE_HEALTHY = 2;
  RUNTIME_STATE_DEGRADED = 3;
  RUNTIME_STATE_UNHEALTHY = 4;
  RUNTIME_STATE_SHUTTING_DOWN = 5;
  RUNTIME_STATE_STOPPED = 6;
}

enum ProcessState {
  PROCESS_STATE_UNSPECIFIED = 0;
  PROCESS_STATE_CREATED = 1;
  PROCESS_STATE_STARTING = 2;
  PROCESS_STATE_RUNNING = 3;
  PROCESS_STATE_TERMINATING = 4;
  PROCESS_STATE_EXITED = 5;
  PROCESS_STATE_SIGNALED = 6;
  PROCESS_STATE_FAILED = 7;
}

enum ExitReason {
  EXIT_REASON_UNSPECIFIED = 0;
  EXIT_REASON_EXITED = 1;
  EXIT_REASON_SIGNALED = 2;
  EXIT_REASON_TIMEOUT = 3;
  EXIT_REASON_CANCELLED = 4;
  EXIT_REASON_START_FAILED = 5;
  EXIT_REASON_LOST = 6;
}

enum StreamKind {
  STREAM_KIND_UNSPECIFIED = 0;
  STREAM_KIND_STDIN = 1;
  STREAM_KIND_STDOUT = 2;
  STREAM_KIND_STDERR = 3;
  STREAM_KIND_PTY_INPUT = 4;
  STREAM_KIND_PTY_OUTPUT = 5;
}

enum CaptureMethod {
  CAPTURE_METHOD_UNSPECIFIED = 0;
  CAPTURE_METHOD_PIPE = 1;
  CAPTURE_METHOD_PTY = 2;
  CAPTURE_METHOD_PROXY = 3;
  CAPTURE_METHOD_INOTIFY = 4;
  CAPTURE_METHOD_SNAPSHOT = 5;
  CAPTURE_METHOD_EBPF = 6;
  CAPTURE_METHOD_NETLINK = 7;
  CAPTURE_METHOD_INTERNAL = 8;
}

enum Confidence {
  CONFIDENCE_UNSPECIFIED = 0;
  CONFIDENCE_OBSERVED = 1;
  CONFIDENCE_INFERRED = 2;
  CONFIDENCE_UNKNOWN = 3;
}

enum EventPriority {
  EVENT_PRIORITY_UNSPECIFIED = 0;
  EVENT_PRIORITY_CRITICAL = 1;
  EVENT_PRIORITY_NORMAL = 2;
  EVENT_PRIORITY_LOW = 3;
}

enum Feature {
  FEATURE_UNSPECIFIED = 0;
  FEATURE_FILESYSTEM_DIFFING = 1;
  FEATURE_LIVE_FILESYSTEM_WATCHING = 2;
  FEATURE_NETWORK_COLLECTION = 3;
  FEATURE_PAYLOAD_CAPTURE = 4;
  FEATURE_VERBOSE_IO_CAPTURE = 5;
  FEATURE_RESOURCE_SAMPLING = 6;
}

enum Signal {
  SIGNAL_UNSPECIFIED = 0;
  SIGNAL_HUP = 1;
  SIGNAL_INT = 2;
  SIGNAL_QUIT = 3;
  SIGNAL_TERM = 4;
  SIGNAL_KILL = 5;
  SIGNAL_USR1 = 6;
  SIGNAL_USR2 = 7;
  SIGNAL_STOP = 8;
  SIGNAL_CONT = 9;
}

enum CaptureMode {
  CAPTURE_MODE_UNSPECIFIED = 0;
  CAPTURE_MODE_FULL = 1;
  CAPTURE_MODE_METADATA_ONLY = 2;
  CAPTURE_MODE_DISABLED = 3;
}

enum NetworkMode {
  NETWORK_MODE_UNSPECIFIED = 0;
  NETWORK_MODE_OFF = 1;
  NETWORK_MODE_METADATA = 2;
  NETWORK_MODE_PROXY = 3;
  NETWORK_MODE_PRIVILEGED = 4;
  NETWORK_MODE_PAYLOAD = 5;
}

enum ControlErrorCode {
  CONTROL_ERROR_CODE_UNSPECIFIED = 0;
  CONTROL_ERROR_CODE_INVALID_JSON = 1;
  CONTROL_ERROR_CODE_UNSUPPORTED_VERSION = 2;
  CONTROL_ERROR_CODE_FRAME_TOO_LARGE = 3;
  CONTROL_ERROR_CODE_UNKNOWN_COMMAND = 4;
  CONTROL_ERROR_CODE_INVALID_ARGUMENT = 5;
  CONTROL_ERROR_CODE_MISSING_COMMAND = 6;
  CONTROL_ERROR_CODE_EXECUTION_NOT_FOUND = 7;
  CONTROL_ERROR_CODE_SESSION_NOT_FOUND = 8;
  CONTROL_ERROR_CODE_PROCESS_NOT_FOUND = 9;
  CONTROL_ERROR_CODE_PROCESS_START_FAILED = 10;
  CONTROL_ERROR_CODE_PTY_ALLOCATION_FAILED = 11;
  CONTROL_ERROR_CODE_PERMISSION_DENIED = 12;
  CONTROL_ERROR_CODE_POLICY_DENIED = 13;
  CONTROL_ERROR_CODE_FEATURE_UNAVAILABLE = 14;
  CONTROL_ERROR_CODE_CAPABILITY_UNAVAILABLE = 15;
  CONTROL_ERROR_CODE_QUEUE_FULL = 16;
  CONTROL_ERROR_CODE_RUNTIME_SHUTTING_DOWN = 17;
  CONTROL_ERROR_CODE_INTERNAL_ERROR = 18;
}

// ===================== value messages =====================

message EnvVar {
  string key = 1;
  string value = 2;
}

message CapturePolicy {
  CaptureMode stdout = 1;
  CaptureMode stderr = 2;
  CaptureMode stdin = 3;
}

message ArtifactRef {
  string algo = 1;
  string hash = 2;
  uint64 bytes = 3;
}

message TransformMeta {
  bool redacted = 1;
  bool truncated = 2;
  bool coalesced = 3;
  optional uint64 original_byte_count = 4;
}

message Limits {
  uint32 max_frame_bytes = 1;
  uint32 max_processes = 2;
  uint32 max_sessions = 3;
  uint64 event_queue_capacity = 4;
  uint64 spool_limit_bytes = 5;
  uint64 max_inline_payload_bytes = 6;
  uint32 io_chunk_bytes = 7;
}

message FeatureMatrix {
  bool io_capture = 1;
  bool pty = 2;
  bool filesystem = 3;
  NetworkMode network = 4;
  bool privileged = 5;
  bool pidfd = 6;
  bool subreaper = 7;
  // Pipe-mode sessions (`OpenSessionArgs.mode = SESSION_MODE_PIPE`) available.
  bool pipe_sessions = 8;
}

message FeatureState {
  Feature feature = 1;
  bool enabled = 2;
}

// ===================== event payloads =====================

message ProcessStarted {
  int32 pid = 1;
  int32 pgid = 2;
  bool pidfd = 3;
  string executable = 4;
  repeated string args = 5;
  string cwd = 6;
  int64 started_at = 7;
}

message ProcessExited {
  optional int32 exit_code = 1;
  optional int32 signal = 2;
  ExitReason reason = 3;
  uint64 duration_micros = 4;
}

message IoChunk {
  StreamKind stream = 1;
  uint64 byte_count = 2;
  uint64 stream_offset = 3;
  optional bytes content = 4;
  optional ArtifactRef artifact = 5;
  optional TransformMeta transform = 6;
}

message RuntimeStateChanged {
  RuntimeState state = 1;
  optional string reason = 2;
}

message RuntimeHeartbeat {
  RuntimeState state = 1;
}

message TelemetryDropped {
  string reason = 1;
  uint64 count = 2;
  EventPriority priority = 3;
}

enum FileChangeKind {
  FILE_CHANGE_KIND_UNSPECIFIED = 0;
  FILE_CHANGE_KIND_ADDED = 1;
  FILE_CHANGE_KIND_MODIFIED = 2;
  FILE_CHANGE_KIND_DELETED = 3;
  FILE_CHANGE_KIND_RENAMED = 4;
  FILE_CHANGE_KIND_METADATA_CHANGED = 5;
}

enum FileType {
  FILE_TYPE_UNSPECIFIED = 0;
  FILE_TYPE_FILE = 1;
  FILE_TYPE_DIR = 2;
  FILE_TYPE_SYMLINK = 3;
  FILE_TYPE_OTHER = 4;
}

message FileEntry {
  string path = 1;
  FileType file_type = 2;
  uint64 size = 3;
  int64 mtime_micros = 4;
  uint32 mode = 5;
  optional string hash = 6;
  optional string symlink_target = 7;
}

message FileChange {
  FileChangeKind kind = 1;
  string path = 2;
  optional string rename_from = 3;
  optional FileEntry entry = 4;
  bool certain = 5;
}

message FileWatchOverflow { string root = 1; }
message FileSnapshotCompleted { string root = 1; uint64 file_count = 2; }
message FileDiffAvailable { uint64 added = 1; uint64 modified = 2; uint64 deleted = 3; uint64 renamed = 4; }

enum NetworkScheme {
  NETWORK_SCHEME_UNSPECIFIED = 0;
  NETWORK_SCHEME_HTTP = 1;
  NETWORK_SCHEME_HTTPS_CONNECT = 2;
}

message NetworkRequest {
  NetworkScheme scheme = 1;
  optional string method = 2;
  string host = 3;
  uint32 port = 4;
  optional string path = 5;
  optional uint32 status = 6;
  uint64 bytes_sent = 7;
  uint64 bytes_received = 8;
  uint64 duration_micros = 9;
}

message NetworkSourceObserved {
  string host = 1;
  repeated string resolved_ips = 2;
  uint32 port = 3;
  optional NetworkScheme scheme = 4;
  optional string method = 5;
  optional string path = 6;
  optional uint32 status = 7;
}

message EventEnvelope {
  uint32 schema_version = 1;
  string event_id = 2;
  string runtime_id = 3;
  optional string execution_id = 4;
  optional string session_id = 5;
  optional string process_id = 6;
  optional string request_id = 7;
  uint64 sequence = 8;
  int64 observed_at = 9;
  uint64 monotonic_timestamp = 10;
  CaptureMethod capture_method = 11;
  Confidence confidence = 12;
  oneof payload {
    RuntimeStateChanged runtime_state_changed = 20;
    RuntimeHeartbeat runtime_heartbeat = 21;
    ProcessStarted process_started = 22;
    ProcessExited process_exited = 23;
    IoChunk io_chunk = 24;
    TelemetryDropped telemetry_dropped = 25;
    FileChange file_change = 26;
    FileWatchOverflow file_watch_overflow = 27;
    FileSnapshotCompleted file_snapshot_completed = 28;
    FileDiffAvailable file_diff_available = 29;
    NetworkRequest network_request = 30;
    NetworkSourceObserved network_source_observed = 31;
  }
}

// ===================== commands =====================

message ExecArgs {
  optional string execution_id = 1;
  optional string session_id = 2;
  string executable = 3;
  repeated string args = 4;
  optional string cwd = 5;
  repeated EnvVar env = 6;
  bool stdin = 7;
  optional uint64 timeout_millis = 8;
  bool background = 9;
  optional CapturePolicy capture = 10;
  optional Signal graceful_signal = 11;
  bool attach = 12;
}

message ExecutionStartArgs {
  optional string execution_id = 1;
  optional string labels_json = 2;
}

message WriteStdinArgs {
  optional string process_id = 1;
  optional string session_id = 2;
  bytes data = 3;
}

// How a session's leader is wired to the daemon.
enum SessionMode {
  SESSION_MODE_UNSPECIFIED = 0;
  // A pseudoterminal: the leader is a session leader with a controlling tty (interactive shells,
  // TUIs). Output is the PTY byte stream; input is keystrokes; resize applies.
  SESSION_MODE_PTY = 1;
  // Plain pipes: stdin/stdout/stderr are pipes, no tty (protocol processes such as JSON-RPC
  // servers). stdout is the journaled/attachable output, stderr is recorded as telemetry only,
  // stdin is the input path; resize is rejected.
  SESSION_MODE_PIPE = 2;
}

message OpenSessionArgs {
  optional string execution_id = 1;
  optional string shell = 2;
  repeated string args = 3;
  optional string cwd = 4;
  repeated EnvVar env = 5;
  uint32 cols = 6;
  uint32 rows = 7;
  optional string term = 8;
  // Defaults to PTY when unspecified (wire compatibility with pre-pipe clients).
  SessionMode mode = 9;
}

message RuntimeGracefulShutdownArgs { optional uint64 grace_millis = 1; }
message ExecutionStopArgs { string execution_id = 1; }
message SignalProcessArgs { string process_id = 1; Signal signal = 2; }
message KillProcessArgs { string process_id = 1; }
message ListProcessesArgs { optional string execution_id = 1; }
message CloseStdinArgs { string process_id = 1; }
message CloseSessionArgs { string session_id = 1; }
message ResizePtyArgs { string session_id = 1; uint32 cols = 2; uint32 rows = 3; }
message SetFeatureStateArgs { Feature feature = 1; bool enabled = 2; }
message Empty {}

enum AttachMode {
  ATTACH_MODE_UNSPECIFIED = 0;
  ATTACH_MODE_INTERACTIVE = 1;
  ATTACH_MODE_OBSERVE = 2;
}
message AttachSessionArgs {
  string session_id = 1;
  AttachMode mode = 2;
  // When set, replay the session's durable output journal starting at this sequence (clamped to
  // the first retained record) before live frames; data-frame `seq` values are journal sequences.
  // Absent = live tail only (no replay).
  optional uint64 from_sequence = 3;
}
message SignalSessionArgs { string session_id = 1; Signal signal = 2; }
// Point a bindable mount's path at a subdirectory of its root (see ADR-0014). An empty subpath
// unbinds. The root was mounted at workspace start; the path itself becomes a symlink.
message BindMountArgs { string mount_path = 1; string subpath = 2; }
// Session capture store (ADR-0015).
enum CaptureKind {
  CAPTURE_KIND_UNSPECIFIED = 0;
  CAPTURE_KIND_AUTO = 1;
  CAPTURE_KIND_TURN = 2;
  CAPTURE_KIND_CHECKPOINT = 3;
  CAPTURE_KIND_SUSPEND = 4;
  CAPTURE_KIND_FINAL = 5;
}
message CaptureNowArgs { CaptureKind kind = 1; }
// What a `capture.flush` waits for. UNSPECIFIED is SUSPEND: a client that predates the field
// sends an empty `CaptureFlushArgs` (the command carried `Empty` before), and gets what it got.
enum CaptureFlushKind {
  CAPTURE_FLUSH_KIND_UNSPECIFIED = 0;
  // A small-class snap; returns once every capture ahead of a bulk capture still uploading is
  // registered (what a change or a diff needs). The bulk capture keeps uploading.
  CAPTURE_FLUSH_KIND_SUSPEND = 1;
  // The executor is ending. In order: the daemon stops admitting new processes, execs, sessions
  // and SFTP bridges (for good); terminates every managed process and session (SIGTERM, then
  // SIGKILL after `grace_ms`) and waits for them; snaps the small AND the bulk class (both must
  // succeed); then ships until nothing is pending, bulk included. The answer's `complete` says
  // whether all of that happened; anything else (a snap failed, the lease is fenced, the chain
  // conflicts, `deadline_ms` passed, a process survived SIGKILL) leaves it false with a reason.
  CAPTURE_FLUSH_KIND_FINAL = 2;
}
message CaptureFlushArgs {
  CaptureFlushKind kind = 1;
  // How long the flush may take, milliseconds. Honoured as given (never clamped to the shutdown
  // grace). Absent: a suspend flush is bounded by the daemon's shutdown grace, as before; a final
  // flush has no deadline and returns when it is complete, or when it can never be (a fence, a
  // conflict, a failed snap).
  optional uint64 deadline_ms = 2;
  // Final only: how long managed processes get after SIGTERM before SIGKILL, milliseconds.
  // Absent: the daemon's shutdown grace. Counted inside `deadline_ms`.
  optional uint64 grace_ms = 3;
}
// What a capture snapped: the small class (git, `.git` bookkeeping, harness home) or the bulk
// class (dependencies, build outputs).
enum CaptureClass {
  CAPTURE_CLASS_UNSPECIFIED = 0;
  CAPTURE_CLASS_SMALL = 1;
  CAPTURE_CLASS_BULK = 2;
}
message ReadSessionOutputArgs {
  string session_id = 1;
  uint64 from_sequence = 2;
  // Cap on returned payload bytes (defaulted/clamped by the daemon).
  optional uint64 max_bytes = 3;
}
message DetachSessionArgs { string channel_id = 1; }
message OpenForwardArgs { string host = 1; uint32 port = 2; optional string execution_id = 3; optional string protocol = 4; }
message CloseForwardArgs { string channel_id = 1; }
message OpenSftpArgs { optional string execution_id = 1; optional string cwd = 2; }
message CloseSftpArgs { string channel_id = 1; }

message Command {
  oneof command {
    Empty runtime_health = 1;
    Empty runtime_get_capabilities = 2;
    RuntimeGracefulShutdownArgs runtime_graceful_shutdown = 3;
    Empty runtime_kill = 4;
    ExecutionStartArgs execution_start = 5;
    ExecutionStopArgs execution_stop = 6;
    ExecArgs exec = 7;
    SignalProcessArgs signal_process = 8;
    KillProcessArgs kill_process = 9;
    ListProcessesArgs list_processes = 10;
    WriteStdinArgs write_stdin = 11;
    CloseStdinArgs close_stdin = 12;
    OpenSessionArgs open_session = 13;
    CloseSessionArgs close_session = 14;
    ResizePtyArgs resize_pty = 15;
    Empty list_sessions = 16;
    SetFeatureStateArgs set_feature_state = 17;
    Empty get_runtime_metrics = 18;
    AttachSessionArgs attach_session = 19;
    DetachSessionArgs detach_session = 20;
    OpenForwardArgs open_forward = 21;
    CloseForwardArgs close_forward = 22;
    OpenSftpArgs open_sftp = 23;
    CloseSftpArgs close_sftp = 24;
    SignalSessionArgs signal_session = 25;
    ReadSessionOutputArgs read_session_output = 26;
    BindMountArgs bind_mount = 27;
    CaptureNowArgs capture_now = 28;
    CaptureFlushArgs capture_flush = 29;
    Empty capture_status = 30;
    Empty lease_epoch = 31;
    Empty capture_replan = 32;
  }
}

// ===================== results =====================

message Capabilities {
  uint32 schema_version = 1;
  string runtime_id = 2;
  optional string workspace_id = 3;
  string os = 4;
  string arch = 5;
  string daemon_version = 6;
  FeatureMatrix features = 7;
  Limits limits = 8;
}

message HealthReport {
  RuntimeState state = 1;
  string runtime_id = 2;
  uint64 uptime_millis = 3;
  uint32 active_executions = 4;
  uint32 active_sessions = 5;
  uint32 active_processes = 6;
  uint64 queue_depth = 7;
  uint64 queue_capacity = 8;
  uint64 spool_bytes = 9;
  uint64 spool_limit_bytes = 10;
  uint64 retry_count = 11;
  optional int64 last_delivery_at = 12;
  uint64 dropped_events = 13;
  uint64 redacted_events = 14;
  uint64 coalesced_events = 15;
  uint64 truncated_events = 16;
  bool sink_connected = 17;
  repeated FeatureState feature_states = 18;
  repeated string degradation_reasons = 19;
}

message ExecAccepted { string process_id = 1; int32 pid = 2; int32 pgid = 3; bool pidfd = 4; }
message SessionOpened { string session_id = 1; string process_id = 2; int32 pid = 3; }

message ProcessSummary {
  string process_id = 1;
  int32 pid = 2;
  int32 pgid = 3;
  ProcessState state = 4;
  string executable = 5;
  optional string execution_id = 6;
  optional string session_id = 7;
}
message ProcessList { repeated ProcessSummary processes = 1; }

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_RUNNING = 1;
  SESSION_STATE_EXITED = 2;
}

message SessionSummary {
  string session_id = 1;
  string process_id = 2;
  int32 pid = 3;
  uint32 cols = 4;
  uint32 rows = 5;
  optional string execution_id = 6;
  SessionState state = 7;
  optional int32 exit_code = 8;
  optional int32 signal = 9;
  int64 started_at_micros = 10;
  // Journal cursor bounds: the first still-retained output sequence and the next to be assigned.
  uint64 first_journal_sequence = 11;
  uint64 next_journal_sequence = 12;
  // PTY unless the session was opened in pipe mode (unspecified reads as PTY).
  SessionMode mode = 13;
}
message SessionList { repeated SessionSummary sessions = 1; }

message SessionOutputChunk { uint64 sequence = 1; bytes data = 2; }
message SessionOutput {
  string session_id = 1;
  repeated SessionOutputChunk chunks = 2;
  // Cursor to pass as the next from_sequence (chunks were [from, next)).
  uint64 next_sequence = 3;
  // First sequence still retained in the journal (requests below this are clamped up to it).
  uint64 first_available_sequence = 4;
  SessionState state = 5;
  optional int32 exit_code = 6;
  optional int32 signal = 7;
}

message RuntimeMetrics {
  uint64 uptime_millis = 1;
  uint64 events_emitted = 2;
  uint64 events_delivered = 3;
  uint64 dropped_events = 4;
  uint64 queue_depth = 5;
  uint64 spool_bytes = 6;
  uint32 active_processes = 7;
  uint32 active_sessions = 8;
}

message ShutdownAccepted { uint64 grace_millis = 1; }
message StreamAttached { string channel_id = 1; }
message ForwardOpened { string channel_id = 1; }
message SftpOpened { string channel_id = 1; }
message ProcessAttached { string process_id = 1; int32 pid = 2; int32 pgid = 3; string channel_id = 4; }
message CaptureStaged { uint64 n = 1; string capture_id = 2; CaptureKind kind = 3; bool unchanged = 4; }
// One class's snaps (`CaptureStatusReport.snaps`). A snap that fails for any reason, scheduled or
// forced, is counted here and its error kept until one succeeds.
message CaptureClassSnaps {
  CaptureClass class = 1;
  // Snaps of this class that failed since the daemon started.
  uint64 snaps_failed = 2;
  // The last snap's error, while the last snap failed; absent once one succeeds.
  optional string last_snap_error = 3;
  // When the current run of failed snaps began (Unix ms), while the last snap failed.
  optional uint64 snap_failing_since_unix_ms = 4;
}
message CaptureStatusReport {
  uint64 epoch = 1;
  string worktree_id = 2;
  optional uint64 head_n = 3;
  uint64 pending = 4;
  uint64 staged_bytes = 5;
  uint64 uploaded_objects = 6;
  uint64 uploaded_bytes = 7;
  uint64 registered = 8;
  bool fenced = 9;
  bool paused = 10;
  optional uint64 last_snap_unix_ms = 11;
  // Classes with a capture the registrar refused for the session's byte quota. Nothing is
  // dropped: the capture stays queued (counted in `pending`) with its staged bytes, the class
  // keeps snapping, and the executor asks again after a backoff until the budget allows.
  repeated CaptureClass refused = 12;
  // Of `pending`, the bulk captures (dependency trees, build outputs) whose objects are still
  // uploading. A suspend capture.flush returns once every other capture is registered; these
  // follow in the background and register after it. A final flush waits for them.
  uint64 pending_bulk = 13;
  // Bytes staged on this disk that no upload has taken yet, over every pending capture (an
  // object two captures share is counted once). What is lost if the disk goes now; 0 once
  // everything is up (captures can still wait to register).
  uint64 pending_bytes = 14;
  // True only when a final capture.flush ran to the end on this executor: admission closed,
  // every managed process terminated and awaited, the small and the bulk class snapped after
  // that, and everything registered (`pending` 0, not fenced). The only answer a control plane
  // may read as "saved"; `pending == 0` alone is not. False from an older daemon.
  bool complete = 15;
  // Why `complete` is false: `not-final` (no final flush has run), `in-progress` (a final flush is
  // running: stopping the writers, snapping, shipping), `processes-remain` (a process
  // or a container of the workspace's Docker daemon outlived SIGKILL, or that daemon could not
  // be reached), `sweep-unavailable` (the daemon cannot see every writer: not a child subreaper
  // and not PID 1 of its PID namespace), `snapshot-failed` (a final snap of either class failed),
  // `unreadable` (a final snap met work it could not read),
  // `fenced`, `conflict` (the chain moved under this executor), `deadline` (`deadline_ms`
  // passed with captures pending), `ship-failed` (shipping kept failing until the deadline),
  // `pending` (a capture was staged after the final flush), `internal` (the flush's task
  // failed). A class whose last snap failed (`snaps`) is `snapshot-failed` too, whenever it
  // failed. Absent when `complete`.
  optional string incomplete_reason = 16;
  // Paths the last snap of each class could not read (listed, stat'ed or opened; a directory
  // counts once), summed over both classes. Never taken as deleted: an automatic snap carries a
  // path's last captured content forward, a final snap fails instead. Absent from an older daemon.
  optional uint64 unreadable = 17;
  // Of `unreadable`, the paths whose last captured content was carried forward.
  optional uint64 carried = 18;
  // The first 20 unreadable paths, virtual (`tree/<path>` under the worktree, `.git/<path>`,
  // `harness/<path>`), small class first.
  repeated string unreadable_paths = 19;
  // A capture the registrar refused to register (422 on `capture.register`) that the executor is
  // working through: `missing-objects` (an object it names is not in the store) or
  // `unrestorable` (a section's tree would not restore). Never dropped: the objects it staged
  // are uploaded again, then it is rebuilt from disk in its place. Absent when none is refused.
  optional string register_refused = 20;
  // That capture's chain position.
  optional uint64 register_refused_n = 21;
  // The first 20 keys the registrar named as missing.
  repeated string register_missing = 22;
  // Register refusals this daemon has seen since it started. Absent from an older daemon.
  optional uint64 register_refusals = 23;
  // The refused capture waits to be rebuilt from disk; nothing behind it registers first.
  bool repairing = 24;
  // A bulk build is in progress (reading the dependency trees, or paused mid-way for a small
  // capture): its capture is not queued yet, so `pending` and `pending_bulk` do not count it, but
  // `pending_bytes` counts what it has staged so far. A drain is not done while this is true.
  bool bulk_building = 25;
  // Each captured class's snaps: how many failed, and the last one's error while it fails (a
  // snap that fails stages nothing: what changed since the last capture is on this disk only).
  // `complete` is false while any class's last snap failed. Absent from an older daemon.
  repeated CaptureClassSnaps snaps = 26;
  // Where this answer stands in the executor's own order (cross-repo decision 17). Control
  // planes order and supersede capture evidence by it, never by their own wall clocks. The
  // position is (epoch, launch, boot_id, boot_generation, observation), with `head_n` beside it.
  // `launch` is the executor `plan.get` named (the launch the session token was issued for),
  // absent when the plan named none: answers of different epochs or launches are different
  // executors' and are never ordered against each other. `boot_id` is random per daemon
  // process. `boot_generation` counts the daemon processes that opened this disk's staging
  // directory, this one included (persisted and fsynced there before the first answer): a
  // recovery boot of the same disk has a higher one; 0 when it could not be persisted.
  // `observation` is strictly increasing within one boot over every answer and every final seal
  // (the seal's manifest carries its own); an answer's content is computed under the number it
  // takes, so a higher number never describes an older state.
  //
  // Same (epoch, launch, boot_id): order by `observation`. Same (epoch, launch), different boot
  // ids, both generations above 0 and different: order by (boot_generation, observation).
  // Anything else (a field absent from an older daemon, a generation of 0, two boot ids under
  // one generation) is incomparable, and incomparable or contradictory evidence fails closed:
  // no deletion, no "saved".
  optional string launch = 27;
  optional string boot_id = 28;
  optional uint64 boot_generation = 29;
  optional uint64 observation = 30;
}
message LeaseEpochReport { uint64 epoch = 1; string worktree_id = 2; bool fenced = 3; }
message CaptureReplanned {
  string worktree_id = 1;
  uint64 epoch = 2;
  optional uint64 head_n = 3;
  optional string head_capture_id = 4;
  uint64 files_written = 5;
  uint64 bytes_written = 6;
  uint64 files_skipped = 7;
  uint64 bytes_skipped = 8;
  uint64 removed = 9;
  bool unchanged = 10;
}

message CommandResult {
  oneof result {
    HealthReport health = 1;
    Capabilities capabilities = 2;
    ExecAccepted exec_accepted = 3;
    SessionOpened session_opened = 4;
    ProcessList process_list = 5;
    SessionList session_list = 6;
    RuntimeMetrics metrics = 7;
    ShutdownAccepted shutdown_accepted = 8;
    Empty accepted = 9;
    StreamAttached stream_attached = 10;
    ForwardOpened forward_opened = 11;
    SftpOpened sftp_opened = 12;
    ProcessAttached process_attached = 13;
    SessionOutput session_output = 14;
    CaptureStaged capture_staged = 15;
    CaptureStatusReport capture_status = 16;
    LeaseEpochReport lease_epoch = 17;
    CaptureReplanned capture_replanned = 18;
  }
}

message ControlError {
  ControlErrorCode code = 1;
  string message = 2;
  optional string detail_json = 3;
}

// ===================== top-level messages =====================

message ControlRequest {
  uint32 schema_version = 1;
  string request_id = 2;
  Command command = 3;
}

message ResponseOutcome {
  oneof outcome {
    CommandResult ok = 1;     // present on success (may itself carry no data via Empty "accepted")
    ControlError error = 2;
  }
}

message ControlResponse {
  uint32 schema_version = 1;
  string request_id = 2;
  ResponseOutcome outcome = 3;
}

// A reliable byte-conduit frame: raw bytes, a flow-control credit, or a close. Carried over the same
// length-prefixed stream as requests/responses/events, addressed by channel_id.
message StreamWindowUpdate { uint64 credits = 1; }
message StreamEnd { optional int32 exit_code = 1; optional int32 signal = 2; optional string error = 3; }
message StreamFrame {
  string channel_id = 1;
  uint64 seq = 2;
  oneof payload {
    bytes data = 3;
    StreamWindowUpdate window_update = 4;
    StreamEnd end = 5;
  }
}

message ClientMessage {
  oneof message {
    ControlRequest request = 1;
    StreamFrame stream = 2;
  }
}

message ServerMessage {
  oneof message {
    ControlResponse response = 1;
    EventEnvelope event = 2;
    StreamFrame stream = 3;
  }
}
