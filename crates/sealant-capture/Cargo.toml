[package]
name = "sealant-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Session capture store engine (ADR-0015): chunk, pack, ship, materialize."

[lints]
workspace = true

[dependencies]
sealant-process = { workspace = true }
notify = { workspace = true }
fastcdc = { workspace = true }
zstd = { workspace = true }
ureq = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ring = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }
nix = { workspace = true, features = ["dir"] }

[features]
# The manual clock (`ManualClock`) and `CaptureConfig::clock`, which injects it: for tests only.
# Only this crate's own tests enable it (the dev-dependency below); no build of the daemon may
# (`scripts/ci-test-support-gate.sh`).
test-support = []

[dev-dependencies]
sealant-capture = { path = ".", features = ["test-support"] }
tempfile = { workspace = true }
# A throwaway PKI and a TLS listener for the channel transport tests.
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
