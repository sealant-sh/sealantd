[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/sealant-sh/sealantd"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Runtime crates additionally opt into clippy::unwrap_used / expect_used via crate-level
# attributes; we do not deny them workspace-wide so that test code can use them freely.
todo = "warn"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "process", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
# Secure WebSocket control frontend (Kubernetes). `ring` keeps the musl/static build free of a C
# toolchain and the scratch image free of a system trust store dependency.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
tokio-tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Public roots the egress proxy verifies brokered upstreams against (never the executor CA).
webpki-roots = "1"
# Validity windows for the egress proxy's minted leaf certificates (rcgen's own date type).
time = "0.3"
# HTTP/1.1 head parsing for the egress proxy's explicit, transparent and MITM paths.
httparse = "1"
# serde / schema
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
# errors / logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Traces and errors to Sentry (SLNT-1351). OTLP over HTTP/protobuf through our own ureq client, so
# the exporter adds no reqwest, hyper, tokio or aws-lc; Sentry's transport is ureq on rustls with
# the ring provider ureq already brings. Both stay off unless the process is given a DSN.
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "trace"] }
opentelemetry-http = { version = "0.33", default-features = false }
tracing-opentelemetry = { version = "0.34", default-features = false }
# Tests decode what the OTLP exporter sends (already built by `opentelemetry-otlp`).
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace"] }
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "tracing", "ureq", "rustls-no-provider"] }
async-trait = "0.1"
http = "1"
# bytes / encoding / hashing
bytes = "1"
base64 = "0.22"
crc32fast = "1"
hex = "0.4"
sha2 = "0.10"
# The same SHA-256, from the assembly `ring` already ships for rustls: about twice the pure-Rust
# one on a CPU without SHA extensions (measured 533 against 290 MB/s on an i9-9900K, 2026-10-02).
ring = "0.17"
getrandom = "0.2"
tempfile = "3"
# Generated inputs for property tests (the restore round trip).
proptest = { version = "1", default-features = false, features = ["std"] }
# session capture store (ADR-0015): content-defined chunking, per-chunk zstd (the C library built by
# cc, as ring already is; no system zstd), presigned-URL HTTP via ureq on rustls+ring (no
# native-tls, no openssl).
fastcdc = "5"
zstd = { version = "0.14", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }
# filesystem telemetry (plan §13)
notify = "8"
walkdir = "2"
# linux syscalls (prefer rustix/nix over raw libc)
nix = { version = "0.31", features = ["process", "signal", "term", "fs", "dir", "user", "poll", "ioctl", "socket", "resource"] }
rustix = { version = "0.38", features = ["process", "fs", "termios", "pipe", "stdio"] }
libc = "0.2"
# AF_VSOCK sockets (the microVM guest's channels to its host) without unsafe code.
socket2 = { version = "0.6", features = ["all"] }
# protobuf wire format (ADR-0012)
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
# cli
clap = { version = "4", features = ["derive"] }
# internal crates
sealant-protocol = { path = "crates/sealant-protocol" }
sealant-runtime-core = { path = "crates/sealant-runtime-core" }
sealant-process = { path = "crates/sealant-process" }
sealant-pty = { path = "crates/sealant-pty" }
sealant-telemetry = { path = "crates/sealant-telemetry" }
sealant-eventlog = { path = "crates/sealant-eventlog" }
sealant-fs = { path = "crates/sealant-fs" }
sealant-network = { path = "crates/sealant-network" }
sealant-control = { path = "crates/sealant-control" }
sealant-capture = { path = "crates/sealant-capture" }
sealant-observability = { path = "crates/sealant-observability" }
sealant-vmm-proto = { path = "crates/sealant-vmm-proto" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
